name: Publish CLI

# Publishes from main only. Runs on every push to main; each registry job
# publishes only if the package.json version isn't already on that registry,
# so commits that don't bump the version are no-ops. To release: bump the
# version in a PR and merge it.
on:
  push:
    branches:
      - main
  workflow_dispatch: # manual retry; the jobs refuse to run off main

# Queue runs so back-to-back merges can't race into a duplicate publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-github:
    name: Publish to GitHub Packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@ethiqueai"

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          FOUND=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ "$FOUND" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION already on GitHub Packages — skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.published == 'false'
        run: npm ci

      - if: steps.check.outputs.published == 'false'
        run: npm run build

      - if: steps.check.outputs.published == 'false'
        run: npm publish

  publish-npm:
    name: Publish to npm
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (also signs provenance)
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          FOUND=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ "$FOUND" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION already on npm — skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.published == 'false'
        run: npm ci

      - if: steps.check.outputs.published == 'false'
        run: npm run build

      # No token: npm authenticates via the trusted publisher configured on npmjs.com.
      - if: steps.check.outputs.published == 'false'
        run: npm publish --access public
