name: Publish CLI

# Runs on every push to main. Each registry job publishes only if the
# package.json version isn't already on that registry, so commits that
# don't bump the version are no-ops. To release: bump the version and merge.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Serialize runs so a main push and a tag push for the same version
# can't race each other into a duplicate publish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package.json version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

  publish-github:
    name: Publish to GitHub Packages
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@ethiqueai"

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          FOUND=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ "$FOUND" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION already on GitHub Packages — skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.published == 'false'
        run: npm ci

      - if: steps.check.outputs.published == 'false'
        run: npm run build

      - if: steps.check.outputs.published == 'false'
        run: npm publish

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing (also signs provenance)
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing needs npm >= 11.5.1, which ships with Node 24.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          FOUND=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)
          if [ "$FOUND" = "$VERSION" ]; then
            echo "::notice::$NAME@$VERSION already on npm — skipping"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.published == 'false'
        run: npm ci

      - if: steps.check.outputs.published == 'false'
        run: npm run build

      # No token: npm authenticates via the trusted publisher configured on npmjs.com.
      - if: steps.check.outputs.published == 'false'
        run: npm publish --access public
